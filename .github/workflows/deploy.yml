name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

# Skip deployment when AWS_ROLE_TO_ASSUME isn't configured. Lets the
# workflow live in the repo without breaking every push on accounts that
# haven't been provisioned yet — set the secret to opt in.
jobs:
  preflight:
    name: Check deploy preconditions
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - id: check
        env:
          ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -n "$ROLE" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "AWS_ROLE_TO_ASSUME is set — deploying."
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping deploy — set AWS_ROLE_TO_ASSUME repo secret to enable. See DEPLOYMENT.md."
          fi

  deploy:
    name: Terraform Apply + Sync Glue Scripts
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    env:
      AWS_REGION:      ${{ secrets.AWS_REGION      || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      ALERT_EMAIL:     ${{ secrets.ALERT_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Verify backend config
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::TF_STATE_BUCKET secret is empty. Set it to the S3 state bucket name (e.g. lh-tfstate-dev-<account>)."
            exit 1
          fi
          echo "Backend: s3://${TF_STATE_BUCKET}/lakehouse/terraform.tfstate in ${AWS_REGION}"
          aws s3 ls "s3://${TF_STATE_BUCKET}/lakehouse/terraform.tfstate" \
            || { echo "::error::Backend state file not found at the location above. Check the bucket name and that the state has been migrated."; exit 1; }

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=lakehouse/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="alert_email=${ALERT_EMAIL}" \
            -var="aws_region=${AWS_REGION}" \
            -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Sync Glue scripts to S3
        # Belt-and-braces: Terraform already uploads via aws_s3_object with etag.
        # This step catches any scripts added outside of Terraform.
        run: |
          BUCKET=$(terraform -chdir=terraform output -raw bucket_name)
          aws s3 sync glue_jobs/ s3://${BUCKET}/glue-scripts/ \
            --exclude "__pycache__/*" \
            --exclude "*.pyc"
